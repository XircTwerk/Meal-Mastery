plugins {
    id 'idea'
    id 'net.neoforged.moddev'
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        mealmastery {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

dependencies {
    // Development runtime only; never on any compile path. On by default
    // because Farmer's Delight is a hard dependency of the shipped mod, so a
    // dev launch without it cannot start at all. Opt out with
    //     ./gradlew :neoforge:runClient -Pdev_farmersdelight=false
    if (findProperty('dev_farmersdelight') != 'false') {
        runtimeOnly "maven.modrinth:farmers-delight:${farmersdelight_neoforge_version}"
    }

    compileOnly project(':common')
}

compileJava {
    source(project(':common').sourceSets.main.allSource)
}

sourcesJar {
    from(project(':common').sourceSets.main.allSource)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    from project(':common').sourceSets.main.resources
    inputs.properties(
            version: version,
            farmersdelight_neoforge_version_range: farmersdelight_neoforge_version_range
    )
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                version: version,
                farmersdelight_neoforge_version_range: farmersdelight_neoforge_version_range
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
