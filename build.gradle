plugins {
    // Applied at the root so VanillaGradle (:common), ModDevGradle (:forge) and
    // IntelliJ's sync all share one copy of idea-ext.
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.1.10'
}

subprojects {
    apply plugin: 'java'

    group = mod_group
    version = mod_version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(java_version as int)
        }
        withSourcesJar()
    }

    repositories {
        mavenCentral()
        maven {
            name = 'Modrinth'
            url = 'https://api.modrinth.com/maven'
            content {
                includeGroup 'maven.modrinth'
            }
        }
        maven {
            // Only for Fabric ASM, which Farmer's Delight Refabricated needs at
            // runtime. Development launches only; never on any compile path.
            name = 'JitPack'
            url = 'https://jitpack.io'
            content {
                includeGroup 'com.github.Chocohead'
            }
        }
        maven {
            // Porting Lib's individual modules, likewise development only.
            name = 'devOs'
            url = 'https://mvn.devos.one/releases'
            content {
                includeGroup 'io.github.fabricators_of_create.Porting-Lib'
            }
        }
        maven {
            // Reach Entity Attributes, pulled in transitively by Porting Lib.
            name = 'JamiesWhiteShirt'
            url = 'https://maven.jamieswhiteshirt.com/libs-release'
            content {
                includeGroup 'com.jamieswhiteshirt'
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-Xlint:deprecation']
    }
}
