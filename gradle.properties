# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod
mod_id=mealmastery
mod_name=Farmer's Delight: Meal Mastery
mod_version=1.0.1
mod_group=com.xirc.mealmastery
mod_author=xirc
mod_description=Turns every meal you cook in Farmer's Delight into persistent culinary progression: mastery, discovery, journals, statistics and challenges.

# Minecraft
minecraft_version=1.20.1
java_version=17

# Farmer's Delight
# Meal Mastery never compiles against Farmer's Delight. Everything is resolved
# through registries, recipe types and tags at runtime, so these coordinates
# exist purely to make development launches useful.
farmersdelight_forge_version=1.20.1-1.3.2
farmersdelight_fabric_version=1.20.1-2.4.1
farmersdelight_forge_version_range=[1.20.1-1.2.0,)
farmersdelight_fabric_version_range=>=1.20.1-2.0.0

# Fabric
fabric_loader_version=0.15.11
fabric_api_version=0.92.2+1.20.1
# Needed only so the Fabric dev launch can load Farmer's Delight Refabricated.
fabric_asm_version=v2.3
porting_lib_version=2.3.8+1.20.1

# Forge
forge_version=47.2.0
forge_loader_range=[47,)

# Testing
junit_version=5.10.2
