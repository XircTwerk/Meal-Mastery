plugins {
    id 'fabric-loom' version '1.13.4'
}

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Development runtime only; never on any compile path. On by default
    // because Farmer's Delight is a hard dependency of the shipped mod, so a
    // dev launch without it cannot start at all. Opt out with
    //     ./gradlew :fabric:runClient -Pdev_farmersdelight=false
    // See gradle.properties for why the version is pinned below the latest.
    if (findProperty('dev_farmersdelight') != 'false') {
        modRuntimeOnly "maven.modrinth:farmers-delight-refabricated:${farmersdelight_fabric_version}"
        // Loom does not unpack a mod dependency's nested jars, and Farmer's
        // Delight needs this one to extend the RecipeBookType enum - without it
        // the game crashes as soon as a world loads.
        modRuntimeOnly "com.github.Chocohead:Fabric-ASM:${fabric_asm_version}"
    }

    compileOnly project(':common')
}

loom {
    runs {
        client {
            client()
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            ideConfigGenerated(true)
            runDir('run-server')
        }
    }
}

compileJava {
    source(project(':common').sourceSets.main.allSource)
}

sourcesJar {
    from(project(':common').sourceSets.main.allSource)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    from project(':common').sourceSets.main.resources
    inputs.properties(
            version: version,
            farmersdelight_fabric_version_range: farmersdelight_fabric_version_range
    )
    filesMatching('fabric.mod.json') {
        expand(
                version: version,
                farmersdelight_fabric_version_range: farmersdelight_fabric_version_range
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
